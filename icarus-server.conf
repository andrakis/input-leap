# Input Leap server configuration for Icarus (the machine with the keyboard + mouse).
#
# Screen names are case-sensitive and must match each client's screen name exactly.
# Edit the links section to match how the machines actually sit on your desk.
#
#   run with:  input-leaps.exe --no-daemon --disable-crypto --name Icarus -c icarus-server.conf

section: screens
	Icarus:
	Cyron:
	chromebook:
end

section: links
	# Moving the mouse off the right edge of Icarus lands on Cyron;
	# off the left edge lands on the Chromebook.
	Icarus:
		right = Cyron
		left  = chromebook

	Cyron:
		left  = Icarus

	chromebook:
		right = Icarus
end

section: options
	# Keep the connection alive and don't let a stuck key trap the cursor.
	heartbeat = 5000
	switchCorners = none
	relativeMouseMoves = false
end
